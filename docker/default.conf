# Сервер внутри контейнера: HTTP на 8080. HTTPS — на внешнем прокси
# (Caddy из docker-compose.yml или прокси, уже стоящий на сервере).

include /etc/nginx/krt/http.conf;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Адрес подложки с токеном Mapbox создаётся при старте из MAPBOX_TOKEN,
    # поэтому токена нет в образе.
    location = /data/scoring/map-config.json {
        alias /tmp/krt/map-config.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/krt/security_headers.conf;
    }

    # Проверка живости для Docker и прокси: без данных
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/krt/site.conf;
}
