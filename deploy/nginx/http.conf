# Общие настройки уровня http: подключаются и на сервере, и в Docker-образе.

# CSP: всё только со своего домена. Исключение — карта скоринга: тайлы подложки
# Mapbox и OpenStreetMap (ARCHITECTURE.md, 16.5).
map $uri $krt_csp {
    default         "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    /scoring.html   "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://api.mapbox.com https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
}

# Токен Mapbox с ограничением по домену проверяется по Referer: странице карты
# отдаём только origin (без пути и параметров), остальным — ничего.
map $uri $krt_referrer {
    default         "no-referrer";
    /scoring.html   "strict-origin";
}

server_tokens off;

# Данные скоринга ~4,8 МБ JSON: сжатие уменьшает их в несколько раз.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types application/json application/javascript text/css image/svg+xml;
