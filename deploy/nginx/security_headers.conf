# Подключается в server и в каждом location с собственным add_header
# nginx не наследует add_header в такие location.
add_header Content-Security-Policy $krt_csp always;  # значение — map в http.conf
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy $krt_referrer always;  # значение — map в http.conf
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
