# Сайт: подключается внутри server {} после root и настроек доступа.
index index.html;
autoindex off;
charset utf-8;
charset_types application/json application/javascript text/css;

include /etc/nginx/krt/security_headers.conf;

if ($request_method !~ ^(GET|HEAD)$) { return 405; }

location / {
    try_files $uri $uri/ =404;
}

# Страницы и данные меняются при пересборке: браузер всегда проверяет свежесть.
location ~* \.(html|json)$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/krt/security_headers.conf;
}

location ~* \.(css|js|webp|otf|svg)$ {
    add_header Cache-Control "public, max-age=3600" always;
    include /etc/nginx/krt/security_headers.conf;
}

location ~ /\. { deny all; }
