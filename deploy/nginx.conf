# Установка на сервер без Docker. Чек-лист: .claude/skills/krt-web-security
# Файлы deploy/nginx/*.conf копируются в /etc/nginx/krt/, этот файл — в sites-enabled.
# Подставьте хост и сертификаты. Вариант в Docker — docker/ и docker-compose.yml.

include /etc/nginx/krt/http.conf;

server {
    listen 80;
    server_name krt-chita.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name krt-chita.example;

    ssl_certificate     /etc/ssl/krt-chita/fullchain.pem;
    ssl_certificate_key /etc/ssl/krt-chita/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/krt-chita;

    # Вариант 1: пароль (htpasswd -B). Вариант 2: allow <сеть VPN>; deny all;
    auth_basic "KRT Chita";
    auth_basic_user_file /etc/nginx/krt-chita.htpasswd;

    include /etc/nginx/krt/site.conf;
}
